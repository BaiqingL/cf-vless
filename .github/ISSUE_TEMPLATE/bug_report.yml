name: Bug report
description: Report a reproducible defect without private deployment data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include credentials, private hostnames, account/resource IDs, client addresses, destinations, packet captures, or generated client files. Use the private security-reporting process for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest sanitized sequence that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cf-vless version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Xray-core
        - sing-box
        - Mihomo
        - Shadowrocket
        - Not client-specific
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include fixed event codes and tool versions only. Do not paste raw configuration or provider output.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist
      options:
        - label: I removed credentials and private infrastructure details.
          required: true
        - label: I searched existing issues and tested the latest release.
          required: true
