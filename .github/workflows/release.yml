name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: Verify release
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.x"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install npm
        run: npm install --global npm@11.17.0

      - name: Install Worker dependencies
        run: npm --prefix worker ci

      - name: Install pinned sing-box
        run: test/conformance/install-sing-box-linux-amd64.sh "$RUNNER_TEMP/sing-box"

      - name: Export sing-box path
        run: echo "SING_BOX_BIN=$RUNNER_TEMP/sing-box" >> "$GITHUB_ENV"

      - name: Run release gate
        run: make check

      - name: Verify pinned Xray reference
        env:
          CF_VLESS_TEST_LOCAL_REFERENCE: "1"
        run: go test ./internal/xray -run '^TestLocalPinnedXrayVLESSWebSocketReferencePair$' -count=1 -timeout=12m

      - name: Validate Worker dry run
        run: npm --prefix worker exec -- wrangler deploy --cwd worker --dry-run --outdir "$RUNNER_TEMP/worker-dist"

      - name: Verify build
        run: go build -trimpath -o "$RUNNER_TEMP/cf-vless" ./cmd/cf-vless

      - name: Verify generated files are unchanged
        run: git diff --exit-code

  publish:
    name: Publish release
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            --notes "Install with \`git clone --branch $TAG --recurse-submodules https://github.com/$GH_REPO.git\`. GitHub-generated source archives omit the pinned Xray submodule and are not complete installations."
