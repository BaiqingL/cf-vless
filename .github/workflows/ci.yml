name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.x"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install npm
        run: npm install --global npm@11.17.0

      - name: Install Worker dependencies
        run: npm --prefix worker ci

      - name: Check
        run: make check

      - name: Verify pinned Xray reference
        env:
          CF_VLESS_TEST_LOCAL_REFERENCE: "1"
        run: go test ./internal/xray -run '^TestLocalPinnedXrayVLESSWebSocketReferencePair$' -count=1 -timeout=12m

      - name: Validate Worker dry run
        run: npm --prefix worker exec -- wrangler deploy --cwd worker --dry-run --outdir "$RUNNER_TEMP/worker-dist"

      - name: Verify generated files are unchanged
        run: git diff --exit-code
