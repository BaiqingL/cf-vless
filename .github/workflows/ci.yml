name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.x"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install npm
        run: npm install --global npm@11.17.0

      - name: Install Worker dependencies
        run: npm --prefix worker ci

      - name: Install pinned sing-box
        run: test/conformance/install-sing-box-linux-amd64.sh "$RUNNER_TEMP/sing-box"

      - name: Export sing-box path
        run: echo "SING_BOX_BIN=$RUNNER_TEMP/sing-box" >> "$GITHUB_ENV"

      - name: Check
        run: make check

      - name: Verify pinned Xray reference
        env:
          CF_VLESS_TEST_LOCAL_REFERENCE: "1"
        run: go test ./internal/xray -run '^TestLocalPinnedXrayVLESSWebSocketReferencePair$' -count=1 -timeout=12m

      - name: Validate Worker dry run
        run: npm --prefix worker exec -- wrangler deploy --cwd worker --dry-run --outdir "$RUNNER_TEMP/worker-dist"

      - name: Verify generated files are unchanged
        run: git diff --exit-code
